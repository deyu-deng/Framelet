<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="100%" height="100%">
  <!--
    吉他 —— 爱好墙第一件。他说"我喜欢音乐，会很多乐器，比如吉他，钢琴和口琴"。
    靠墙立着，琴头略歪：这是他自己说"水平不高"的道具，画太精致就假了。
    色卡与描边沿用 Plobi / Aura 那套；不用剪裁、滤镜、渐变、虚线（渲染器实测不生效）。
  -->
    <!-- 篮球 —— 原来长在 BasketballHoop.svg 的右下角。画法一个字没改，只是拆出来：
       它要先从画外左边飞进 Plobi 手里、跟着手走、扣完再自己弹几下从左边走，
       钉在篮板上就什么都做不了。圆心在 (0,0)，方便按位置摆。 -->
<!-- 6. 暴扣伴生小篮球（挪到右下角，不再和篮圈糊成一团） -->
  <g id="basketball">
    <circle cx="0" cy="0" r="36" fill="#CD6B43" stroke="#241812" stroke-width="8"/>
    <!-- 右下暗面：四个控制点模长均 <=31，整条曲线锁在 r=32 以内，不需要剪裁 -->
    <path d="M 31,0 A 31,31 0 0 1 0,31 C 12,26 26,12 31,0 Z" fill="#AC512C"/>
    <!-- 球纹 -->
    <path d="M -31,0 L 31,0 M 0,-31 L 0,31 M -21,-21 C -6,-8 -6,8 -21,21 M 21,-21 C 6,-8 6,8 21,21"
          fill="none" stroke="#241812" stroke-width="5" stroke-linecap="round"/>
    <!-- 左上受光 -->
    <path d="M -26,-9 Q -24,-21 -12,-25" fill="none" stroke="#FFF8EA" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
